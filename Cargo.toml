[package]
name = "amq-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Stateless AMQ messaging through MCP with native terminal delivery"
repository = "https://github.com/SiavZ/amq-mcp"
readme = "README.md"
default-run = "amq-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.4"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "fs", "time", "signal", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
